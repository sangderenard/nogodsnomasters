defaults:
  authored_python:
    action: ingest_python
    parameters:
      follow_reachable_calls: true
  repository_python:
    action: ingest_python
    parameters:
      follow_reachable_calls: true
  third_party_python:
    action: use_native
    parameters:
      loader: existing_module
      symbol_resolution: in_place
      callbacks: reject
      execution: shell_io.external_references
      shell_capability: host_references
      shell_abi: turing-shell-io-abi.external_references
      external_domain: host_system
  stdlib_python:
    action: use_native
    parameters:
      loader: existing_module
      symbol_resolution: in_place
      callbacks: reject
      execution: shell_io.external_references
      shell_capability: host_references
      shell_abi: turing-shell-io-abi.external_references
      external_domain: host_system
  builtin:
