    port: stdout
    callbacks: reject
- id: python-filesystem-is-a-shell-boundary
  match:
    identity:
    - builtins.open
    - io.*
    - _io.*
    - pathlib.*
  action: python_host_call
  parameters:
    execution: shell_io.file_broker
    callbacks: reject
    shell_capability: files
    shell_abi: turing-shell-io-abi.files
- id: never-extract-cpython-bootstrap
  match:
    module:
    - importlib*
    - _frozen_importlib*
    - inspect
    - ast
    - dis
    - types
  action: reject
  parameters:
    reason: interpreter_implementation
- id: stdlib-re-module-is-real-program
  match:
    module:
    - re
    - re._compiler
    - re._parser
    - re._constants
    - re._casefix
  action: ingest_python
  parameters:
    follow_reachable_calls: true
