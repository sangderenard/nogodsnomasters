<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakToMe</title></head><body style="background:#07100f;color:#d8e6e2;font:15px system-ui,sans-serif">
<noscript><p><a href="/creature_builds/">Choose a version</a></p></noscript>
<script>
// The site's landing page: it shows the version named by "default" in /creature_builds/versions.json.
// Change the default there; this file never changes.
fetch('/creature_builds/versions.json',{cache:'no-cache'}).then(r=>r.json()).then(index=>{
  const page=index.landing||'mechanical_creature', info=index.pages[page];
  const v=info.versions.find(x=>x.version===info.default);
  location.replace(`/creature_builds/${page}/${v.version}/${v.entries[0]}`);
}).catch(()=>location.replace('/creature_builds/'));
</script></body></html>
